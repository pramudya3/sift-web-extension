<!doctype html>
<!-- Design harness: real sidepanel.css + mock content, so UI work can be reviewed
     in a normal tab instead of reloading the extension.
     Render: bash tools/shot.sh [light|dark]  →  dist/preview-<mode>.png
     Theme comes from ?theme=light|dark, the same [data-theme] switch the panel uses. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tabrary preview</title>
    <link rel="stylesheet" href="../extension/sidepanel.css" />
    <style>

      /* simulate the ~400px side panel box inside a normal tab */
      body {
        position: relative;
        width: 400px;
        height: 720px;
        margin: 20px auto;
        border: 2px solid var(--ink);
        padding: 12px 12px 0;
      }
      .toast {
        position: absolute;
        bottom: 56px;
      }
    </style>
  </head>
  <body>
    <header class="head">
      <h1>Tabrary <span class="ver">v0.16.0</span></h1>
      <div class="head-actions">
        <button class="theme" type="button">☾</button>
        <button id="close" class="theme" type="button" title="Close panel" style="background:var(--danger);color:var(--danger-fg)">✕</button>
      </div>
    </header>

    <section class="actions">
      <button id="cta" class="primary wide">Save this window (23 tabs)</button>
      <div id="save-form" class="form" hidden>
        <label class="field">
          <span>Project name</span>
          <input type="text" value="Stripe research" />
        </label>
        <div class="field">
          <span>Tabs to keep (23)</span>
          <div class="picker">
            <div class="picker-head">
              <span class="picker-count">19 of 23 selected</span>
              <button class="picker-mini">All</button>
              <button class="picker-mini">None</button>
            </div>
            <div class="picker-list">
              <label class="picker-row"><input type="checkbox" checked /><img alt="" /><span>API reference – Stripe Documentation</span></label>
              <label class="picker-row"><input type="checkbox" checked /><img alt="" /><span>Pricing &amp; fees for Indonesia</span></label>
              <label class="picker-row"><input type="checkbox" /><img alt="" /><span>Gmail – Inbox (pinned, left out by default)</span></label>
              <label class="picker-row"><input type="checkbox" /><img alt="" /><span>Calendar – Week of Sep 8</span></label>
              <label class="picker-row"><input type="checkbox" checked /><img alt="" /><span>stripe/stripe-node: Node.js library</span></label>
              <label class="picker-row"><input type="checkbox" checked /><img alt="" /><span>Webhook signature verification · Issue #1187</span></label>
            </div>
          </div>
        </div>
        <div class="row">
          <button class="primary">Save + close 19 tabs</button>
          <button>Keep tabs open</button>
          <button>Cancel</button>
        </div>
      </div>
      <label class="toggle">
        <input type="checkbox" checked />
        <span class="switch" aria-hidden="true"></span>
        <span>Group by domain</span>
      </label>
    </section>

    <section class="list">
      <div class="search">
        <input type="search" placeholder="Search projects or domains" />
        <kbd>/</kbd>
      </div>
      <div class="projects">
        <article class="card">
          <div class="card-head">
            <div class="card-text">
              <button class="card-title">Instagram API research</button>
              <span class="meta">5 tabs · 20m ago</span>
            </div>
            <div class="card-actions">
              <button class="small cyan">Resume</button>
              <button class="small">Add tabs</button>
              <button class="small delete">Delete</button>
            </div>
          </div>
          <div class="card-body">
            <div class="picker">
              <div class="picker-head">
                <span class="picker-count">2 of 5 selected</span>
                <button class="picker-mini">All</button>
                <button class="picker-mini">None</button>
              </div>
              <div class="picker-list">
                <label class="picker-row"><input type="checkbox" checked /><img alt="" /><span>Instagram Graph API – docs</span></label>
                <label class="picker-row"><input type="checkbox" checked /><img alt="" /><span>Webhooks verification guide</span></label>
                <label class="picker-row"><input type="checkbox" /><img alt="" /><span>Pricing page</span></label>
                <label class="picker-row"><input type="checkbox" /><img alt="" /><span>Rate limits explained</span></label>
              </div>
            </div>
            <div class="row">
              <button class="primary">Save 2 tabs</button>
              <button>Cancel</button>
            </div>
          </div>
        </article>
        <article class="card">
          <div class="card-head">
            <div class="card-text">
              <button class="card-title">Stripe research</button>
              <span class="meta">23 tabs · 2h ago</span>
            </div>
            <div class="card-actions">
              <button class="small cyan">Resume</button>
              <button class="small">Add tabs</button>
              <button class="small delete">Delete</button>
            </div>
          </div>
          <div class="card-body">
            <div class="domain-group">
              <div class="domain">stripe.com · 3</div>
              <button class="tab"><img alt="" />API reference – Stripe Documentation</button>
              <button class="tab"><img alt="" />Pricing &amp; fees for Indonesia</button>
              <button class="tab"><img alt="" />Checkout Sessions | Stripe API</button>
            </div>
            <div class="domain-group">
              <div class="domain">github.com · 2</div>
              <button class="tab"><img alt="" />stripe/stripe-node: Node.js library</button>
              <button class="tab"><img alt="" />Webhook signature verification · Issue #1187</button>
            </div>
          </div>
        </article>

        <article class="card">
          <div class="card-head">
            <div class="card-text">
              <button class="card-title">Auth migration</button>
              <span class="meta">14 tabs · yesterday</span>
            </div>
            <div class="card-actions">
              <button class="small cyan">Resume</button>
              <button class="small">Add tabs</button>
              <button class="small armed">Delete?</button>
            </div>
          </div>
        </article>

        <article class="card">
          <div class="card-head">
            <div class="card-text">
              <button class="card-title">Competitor pricing + 4 more</button>
              <span class="meta">10 tabs · 3d ago</span>
            </div>
            <div class="card-actions">
              <button class="small cyan">Resume</button>
              <button class="small">Add tabs</button>
              <button class="small delete">Delete</button>
            </div>
          </div>
        </article>
      </div>
    </section>

    <footer class="foot">
      <button class="small">Export</button>
      <button class="small">Import</button>
      <span class="note">Local only · nothing leaves this browser</span>
    </footer>

    <p class="toast">Saved “Stripe research” and closed 23 tabs</p>

    <script>
      const theme = new URLSearchParams(location.search).get('theme') || 'light';
      document.documentElement.dataset.theme = theme;

      // the toast is a live event, not the resting state of the panel — opt in with ?toast=1
      if (!new URLSearchParams(location.search).has('toast')) {
        document.querySelector('.toast').hidden = true;
      }

      // ?state=save renders the save form instead of the CTA, like the real panel
      if (new URLSearchParams(location.search).get('state') === 'save') {
        document.getElementById('cta').hidden = true;
        document.getElementById('save-form').hidden = false;
      }

      // ?projects=N clones the sample card N times for perf/memory measurement
      const wanted = Number(new URLSearchParams(location.search).get('projects') || 0);
      if (wanted >= 1) {
        const list = document.querySelector('.projects');
        const sample = list.firstElementChild;
        const heapBefore = performance.memory?.usedJSHeapSize ?? 0;
        const t0 = performance.now();
        const collapsed = new URLSearchParams(location.search).has('collapsed');
        while (list.children.length < wanted) {
          const clone = sample.cloneNode(true);
          if (collapsed) clone.querySelector('.card-body')?.remove(); // realistic default state
          list.appendChild(clone);
        }
        document.documentElement.dataset.perf = JSON.stringify({
          projects: list.children.length,
          nodes: document.getElementsByTagName('*').length,
          imgs: document.images.length,
          heapBeforeMB: +(heapBefore / 1048576).toFixed(2),
          heapAfterMB: performance.memory
            ? +(performance.memory.usedJSHeapSize / 1048576).toFixed(2)
            : -1,
          windowMB: +(performance.memory?.totalJSHeapSize / 1048576 || 0).toFixed(2),
          layoutMs: +(performance.now() - t0).toFixed(1),
        });
      }

      // mirrors applyTheme(): glyph shows the CURRENT theme
      const themeButton = document.querySelector('.theme');
      themeButton.textContent = theme === 'dark' ? '☾' : '☀';
      themeButton.title = `Switch to ${theme === 'dark' ? 'light' : 'dark'} theme`;

      // fake favicons, one colour per host so rows read like real ones
      const colors = ['#635bff', '#24292f', '#ff7a59', '#3ecf8e', '#00a8a8', '#c8382e'];
      document.querySelectorAll('img').forEach((img, i) => {
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><rect width="16" height="16" fill="${colors[i % colors.length]}"/></svg>`;
        img.src = `data:image/svg+xml,${encodeURIComponent(svg)}`;
      });
    </script>
  </body>
</html>
